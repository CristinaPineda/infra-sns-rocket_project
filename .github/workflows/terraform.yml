name: "Terraform Workflow"

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      project_name:
        type: string
        required: true
      aws-assume-role-arn:
        type: string
        required: true
      aws-region:
        type: string
        required: true
      aws-statefile-s3-bucket:
        type: string
        required: true
      aws-lock-dynamodb-table:
        type: string
        required: true
      sns-logging-role-arn: # NOVO INPUT
              type: string
              required: true
              description: "ARN da IAM Role única para logs de sucesso e falha do SNS."
      destroy:
        type: boolean
        required: false
        default: false
        description: "Define se o comando 'terraform destroy' deve ser executado (true para destruir, false para plan/apply)"

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-assume-role-arn }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ inputs.aws-region }}

      - name: Terraform Init
        run: |
          cd infra && \
          terraform init \
            -backend-config="bucket=${{ inputs.aws-statefile-s3-bucket }}" \
            -backend-config="region=${{ inputs.aws-region }}" \
            -backend-config="dynamodb_table=${{ inputs.aws-lock-dynamodb-table }}"

      - name: Terraform Validate
        run: cd infra && terraform validate

      - name: Terraform Destroy
        if: inputs.destroy == true
        id: terraform-destroy
        run: |
          cd infra && \
          terraform workspace select -or-create ${{ inputs.environment }} && \ 
          terraform destroy \
            -var="environment=${{ inputs.environment }}" \
            -var-file="envs/${{ inputs.environment }}/terraform.tfvars" \ 
            -auto-approve \
            -lock=false

      - name: Terraform Plan
        if: inputs.destroy == false
        id: terraform-plan
        run: |
          cd infra && \
          terraform workspace select -or-create ${{ inputs.environment }} && \
          terraform plan \
            -var="environment=${{ inputs.environment }}" \
            -var-file="envs/${{ inputs.environment }}/terraform.tfvars" \
            -out="${{ inputs.environment }}.plan" \
            -lock=false

      - name: Terraform Apply
        if: inputs.destroy == false
        id: terraform-apply
        run: |
          cd infra && \
          terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }} && \
          terraform apply \
            -lock=false \
            "${{ inputs.environment }}.plan"

      - name: Configure SNS SQS Delivery Logging
              # Garante que só roda se o apply foi um sucesso e não é um destroy
        if: inputs.destroy == false && steps.terraform-apply.outcome == 'success'
        run: |
          cd infra
          # 1. Obtém os ARNs do Terraform (seus outputs)
          SNS_TOPIC_ARN=$(terraform output -raw sns_topic_arn)
          LOG_ROLE_ARN=$(terraform output -raw sns_logging_role_arn)
          
          echo "Configurando logs SQS no Tópico: $SNS_TOPIC_ARN"

          # 2. Configura a mesma Role para logs de SUCESSO via SQS
          aws sns set-topic-attributes \
            --topic-arn "$SNS_TOPIC_ARN" \
            --attribute-name **SQSSuccessFeedbackRoleArn** \
            --attribute-value "$LOG_ROLE_ARN"

          # 3. Define a taxa de amostragem de SUCESSO para 100%
          aws sns set-topic-attributes \
            --topic-arn "$SNS_TOPIC_ARN" \
            --attribute-name **SQSSuccessFeedbackSampleRate** \
            --attribute-value "100"
            
          # 4. Configura a mesma Role para logs de FALHA via SQS
          aws sns set-topic-attributes \
            --topic-arn "$SNS_TOPIC_ARN" \
            --attribute-name **SQSFailureFeedbackRoleArn** \
            --attribute-value "$LOG_ROLE_ARN"
            
          echo "Configuração de logs concluída com sucesso."
